name: WINGS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: snakemake_env
          python-version: "3.12"
          channels: conda-forge,bioconda
          channel-priority: strict
          auto-activate-base: false

      - name: Install test dependencies
        shell: bash -el {0}
        run: |
          conda install -y \
            -c conda-forge \
            -c bioconda \
            snakemake=9.24.0 \
            pytest

      - name: Show versions
        shell: bash -el {0}
        run: |
          python --version
          snakemake --version
          pytest --version
          conda --version

      - name: Run WINGS test suite
        shell: bash -el {0}
        run: |
          python -m pytest -q
